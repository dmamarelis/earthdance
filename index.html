<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EarthDance · Ο Χορός της Γης</title>
  <meta name="description" content="Interactive NISAR radar explorer: water, crops and sinking ground.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ───────── Loader ───────── -->
<div id="loader">
  <div class="loader-rings"><i></i><i></i><i></i><b></b></div>
  <div class="loader-name">EarthDance</div>
  <div class="loader-sub" id="loaderMsg">Φόρτωση δεδομένων ραντάρ…</div>
</div>

<div id="app" data-mode="explore">

  <!-- ───────── Maps ───────── -->
  <div id="map" class="map"></div>
  <div id="mapB" class="map map-b" hidden></div>
  <div id="swipe" hidden>
    <div class="swipe-line"></div>
    <button class="swipe-handle" aria-label="Σύρε για σύγκριση">
      <svg viewBox="0 0 24 24"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6"/></svg>
    </button>
    <span class="swipe-tag swipe-tag-l" id="swipeTagL"></span>
    <span class="swipe-tag swipe-tag-r" id="swipeTagR"></span>
  </div>

  <!-- ───────── Top bar ───────── -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="27" r="3.2" class="bm-dot"/>
        <path d="M11 22a12 12 0 0 1 18 0" class="bm-a"/>
        <path d="M6.5 17a19 19 0 0 1 27 0" class="bm-b"/>
        <path d="M2.5 11.5a26 26 0 0 1 35 0" class="bm-c"/>
      </svg>
      <div class="brand-text">
        <strong>EarthDance</strong>
        <span id="siteName"></span>
      </div>
    </div>

    <nav class="modes" role="tablist">
      <button class="mode is-active" data-mode="explore" data-i18n="mode.explore"></button>
      <button class="mode" data-mode="story" data-i18n="mode.story"></button>
      <button class="mode" data-mode="status"><span data-i18n="mode.status"></span><b class="mode-badge" id="alertCount" hidden></b></button>
    </nav>

    <div class="top-actions">
      <div class="src-switch" role="group" aria-label="Data">
        <button data-src="real" data-i18n="src.real"></button>
        <button data-src="demo" data-i18n="src.demo"></button>
      </div>
      <span class="demo-badge" id="demoBadge" hidden data-i18n="demo.badge"></span>
      <button class="chip-btn" id="btnValidation">
        <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg><span data-i18n="nav.validation"></span>
      </button>
      <button class="chip-btn icon-only" id="btnAbout" aria-label="About">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
      </button>
      <button class="lang" id="btnLang" aria-label="Language"><b>EL</b><i>EN</i></button>
      <button class="chip-btn icon-only only-mobile" id="btnDrawer" aria-label="Layers">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>
      </button>
    </div>
  </header>

  <!-- ───────── Left: layers (explore) / daily briefing (status) ───────── -->
  <aside id="left" class="panel">
    <button class="collapse-btn" id="leftCollapse" data-i18n-title="ui.hide"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="status-only">
      <div id="brief"></div>
      <section id="ask" hidden></section>
      <section id="scenario"></section>
    </div>

    <div class="explore-only">
      <div class="panel-head">
        <h2 data-i18n="layers.title"></h2>
        <span class="count" id="layerCount"></span>
      </div>
      <div id="layerList" class="layer-list"></div>
      <p class="missing-note" id="missingNote" hidden></p>

      <div class="legend" id="legend"></div>
    </div>

    <div class="story-only">
      <div class="story-progress" id="storyDots"></div>
      <div class="story-kicker" id="storyKicker"></div>
      <h1 class="story-title" id="storyTitle"></h1>
      <p class="story-body" id="storyBody"></p>
      <div class="legend legend-compact" id="storyLegend"></div>
      <div class="story-nav">
        <button class="btn ghost" id="storyPrev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="btn primary" id="storyNext"><span id="storyNextLabel"></span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </div>
  </aside>

  <!-- ───────── Right: point inspector ───────── -->
  <aside id="right" class="panel" aria-hidden="true">
    <div class="region-view" id="regionView"></div>
    <div class="point-view">
    <div class="insp-head">
      <div>
        <span class="kind" id="pKind"></span>
        <h2 id="pName"></h2>
        <div class="coords" id="pCoords"></div>
      </div>
      <button class="x" data-close-right aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="tiles" id="pTiles"></div>
    <div class="agree" id="pAgree" hidden></div>

    <div class="tabs">
      <button class="tab is-active" data-tab="ground" data-i18n="tab.ground"></button>
      <button class="tab" data-tab="radar" data-i18n="tab.radar"></button>
      <button class="listen" id="btnListen">
        <span class="eq"><i></i><i></i><i></i><i></i></span><span id="listenLabel"></span>
      </button>
    </div>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="chart-note" id="chartNote"></div>

    <section class="card why" id="pWhy"></section>
    <section class="card voice" id="pVoice" hidden></section>

    <details class="card unknowns">
      <summary data-i18n="unknowns.title"></summary>
      <ul id="unknownList"></ul>
    </details>
    </div>
  </aside>

  <!-- ───────── Optical vs radar ───────── -->
  <div class="sensor" id="sensor">
    <div class="sensor-switch" role="group">
      <button data-sensor="optical"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.1 9.1 4.5 4.5 0 0 0 7 18z"/></svg><span data-i18n="sensor.optical"></span></button>
      <button data-sensor="radar"><svg viewBox="0 0 24 24"><circle cx="12" cy="17" r="2"/><path d="M8 13a6 6 0 0 1 8 0M5 10a10 10 0 0 1 14 0"/></svg><span data-i18n="sensor.radar"></span></button>
    </div>
    <div class="sensor-note" id="sensorNote"></div>
  </div>
  <div id="probe" hidden></div>

  <div class="hint" id="hint"><span class="pulse"></span><span data-i18n="hint.click"></span></div>

  <!-- ───────── Map tools ───────── -->
  <div class="maptools">
    <button id="zoomIn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zoomOut" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <hr>
    <button id="btnTilt" aria-label="3D"><b>3D</b></button>
    <button id="btnHome" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg></button>
    <button id="btnAlert" hidden aria-label="Lake alert"><svg viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/></svg><i></i></button>
  </div>

  <!-- collapsed left panel: a small pill that brings it back -->
  <button class="panel left-pill" id="leftPill" hidden><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg><span id="leftPillLabel"></span></button>

  <!-- ───────── Timeline ───────── -->
  <footer id="timeline" class="panel">
    <div class="tl-row">
      <div class="tl-date">
        <strong id="tlDate"></strong>
        <span id="tlMeta"></span>
      </div>
      <div class="tl-spacer"></div>
      <div class="compare">
        <select id="compareSel" hidden aria-label="Compare date"></select>
        <button class="chip-btn" id="btnCompare">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M4 6h5v12H4zM15 6h5v12h-5z"/></svg><span data-i18n="tl.compare"></span>
        </button>
      </div>
      <button class="collapse-btn" id="tlCollapse" data-i18n-title="ui.hide"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="track" id="track">
      <div class="track-rail"><div class="track-fill" id="trackFill"></div></div>
      <div class="ticks" id="ticks"></div>
    </div>
  </footer>

  <!-- ───────── Validation sheet ───────── -->
  <div class="sheet" id="validation" hidden>
    <div class="sheet-box">
      <button class="x sheet-x" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="sheet-kicker" data-i18n="val.kicker"></div>
      <h2 class="sheet-title" data-i18n="val.title"></h2>
      <div class="val-grid">
        <div class="val-chart"><canvas id="valChart"></canvas></div>
        <div class="val-side">
          <div class="tiles tiles-v" id="valTiles"></div>
          <p class="val-text" id="valText"></p>
          <p class="val-note" id="valNote"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ───────── About sheet ───────── -->
  <div class="sheet" id="about" hidden>
    <div class="sheet-box sheet-narrow">
      <button class="x sheet-x" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="sheet-kicker">NASA Space Apps Challenge 2026 · Dancing with the SARs</div>
      <h2 class="sheet-title" id="aboutTagline"></h2>
      <h3 data-i18n="about.sources"></h3>
      <ul class="src-list" id="aboutSources"></ul>
      <h3 data-i18n="about.team"></h3>
      <p id="aboutTeam"></p>
      <h3 data-i18n="about.ai"></h3>
      <p id="aboutAi"></p>
    </div>
  </div>

</div>

<!-- printable regional brief (filled by js/status.js, shown only when printing) -->
<div id="report"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
