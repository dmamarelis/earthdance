[package]
name = "ed-sources"
edition.workspace = true
version.workspace = true
description = "EarthDance data sources: weather (Open-Meteo), acquisitions, disk cache, and the data-set builders."

[dependencies]
ed-core.workspace = true
ed-raster.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
jiff = "0.2"
rayon = "1.10"
