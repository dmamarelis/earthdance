[package]
name = "ed-app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "EarthDance native desktop app."

[[bin]]
name = "earthdance"
path = "src/main.rs"

[dependencies]
ed-core.workspace = true
ed-sources.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.38"
serde.workspace = true
rodio = { version = "0.23", default-features = false, features = ["playback"] }
